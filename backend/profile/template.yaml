AWSTemplateFormatVersion: '2010-09-09'
Description: Sovereign Sentinel household profile API resources.

Parameters:
  ExistingHttpApiId:
    Type: String
    Description: Existing API Gateway HTTP API ID that already serves the supplies routes.
  ExistingCognitoAuthorizerId:
    Type: String
    Description: Existing Cognito authorizer ID attached to the API Gateway API.
  ProfilesTableName:
    Type: String
    Default: SS_Household
    Description: DynamoDB table name for Cognito-scoped household profiles.
  ExpiryAlertsTopicArn:
    Type: String
    Description: Existing SNS topic ARN used by the expiry scanner for user-filtered alert emails.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS origin used by the profile Lambda responses.
  ProfileLambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged profile Lambda zip.
  ProfileLambdaCodeS3Key:
    Type: String
    Description: S3 key for the packaged profile Lambda zip.

Resources:
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref ProfilesTableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ProfileLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProfilesTableReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt ProfilesTable.Arn
        - PolicyName: ExpiryAlertSnsSubscriptionManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Subscribe
                Resource: !Ref ExpiryAlertsTopicArn
              - Effect: Allow
                Action:
                  - sns:SetSubscriptionAttributes
                  - sns:Unsubscribe
                Resource:
                  - !Ref ExpiryAlertsTopicArn
                  - !Sub '${ExpiryAlertsTopicArn}:*'

  ProfileLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: sovereign-sentinel-profile
      Runtime: nodejs20.x
      Handler: handler.handler
      Role: !GetAtt ProfileLambdaRole.Arn
      Code:
        S3Bucket: !Ref ProfileLambdaCodeS3Bucket
        S3Key: !Ref ProfileLambdaCodeS3Key
      Environment:
        Variables:
          HOUSEHOLD_TABLE: !Ref ProfilesTable
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SNS_TOPIC_ARN: !Ref ExpiryAlertsTopicArn

  ProfileIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ExistingHttpApiId
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProfileLambda.Arn}/invocations
      PayloadFormatVersion: '2.0'

  GetProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: GET /profile
      AuthorizationType: JWT
      AuthorizerId: !Ref ExistingCognitoAuthorizerId
      Target: !Sub integrations/${ProfileIntegration}

  PutProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: PUT /profile
      AuthorizationType: JWT
      AuthorizerId: !Ref ExistingCognitoAuthorizerId
      Target: !Sub integrations/${ProfileIntegration}

  OptionsProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ExistingHttpApiId
      RouteKey: OPTIONS /profile
      Target: !Sub integrations/${ProfileIntegration}

  ProfileLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProfileLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingHttpApiId}/*/*/profile

Outputs:
  ProfilesTableName:
    Value: !Ref ProfilesTable
  ProfileLambdaName:
    Value: !Ref ProfileLambda
